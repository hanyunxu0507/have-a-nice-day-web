name: CI/CD - Have a nice day webpage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python syntax
        run: python -m py_compile app.py serve.py

      - name: Verify webpage content
        run: |
          test -f index.html
          grep -q "Have a nice day!" index.html

      - name: Smoke test local server
        run: |
          python -m http.server 8123 --directory . >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8123/index.html >/dev/null; then
              echo "Server responded OK"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond"
          cat /tmp/http.log
          exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
