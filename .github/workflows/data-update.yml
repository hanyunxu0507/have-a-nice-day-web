name: Update database from data/

on:
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    name: Regenerate merged_data.db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify sqlite3 is available
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Run clean_and_merge
        run: python clean_and_merge.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merged_data.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update database from data/ changes"
            git push
          fi
