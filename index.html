<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Have a nice day!</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: rgba(255, 255, 255, 0.82);
      --text: #1f2937;
      --accent: #6366f1;
      --shadow: 0 20px 50px rgba(31, 41, 55, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.16), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.14), transparent 45%),
        var(--bg);
    }

    main {
      width: min(100%, 420px);
    }

    .card {
      display: grid;
      place-items: center;
      min-height: 180px;
      padding: 40px 28px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .message {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .message::after {
      content: "";
      display: block;
      width: 48px;
      height: 4px;
      margin: 20px auto 0;
      border-radius: 999px;
      background: var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 class="message">Have a nice day!</h1>
    </div>
  </main>
</body>
</html>
